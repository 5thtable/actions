name: go-build
author: "Elgun Maqsudzada"
description: "Set up Go, then gate on formatting, vet, build, and tests"
inputs:
  go-version:
    description: "Go toolchain version"
    required: false
    default: "1.25"
  working-directory:
    description: "Module directory"
    required: false
    default: "."
  build-only:
    description: "Run only the build, skipping vet and tests"
    required: false
    default: "false"
  test-only:
    description: "Run only the tests, skipping the build"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache-dependency-path: ${{ inputs.working-directory }}/go.sum

    - id: fmt
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    - id: vet
      if: inputs.build-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go vet ./...

    - id: build
      if: inputs.test-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go build ./...

    - id: test
      if: inputs.build-only != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: go test ./...
