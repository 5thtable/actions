name: validate-manifest
author: "Elgun Maqsudzade"
description: "Validate a Kubernetes manifest against a cluster with a dry-run apply"
inputs:
  kubeconfig-base64:
    description: "Base64-encoded kubeconfig for the target cluster"
    required: true
  kube-context:
    description: "Context to select; empty uses the kubeconfig's current context"
    required: false
    default: ""
  manifest-file:
    description: "Path to the manifest to validate"
    required: true
  working-directory:
    description: "Directory to resolve the manifest path from"
    required: false
    default: "."
  dry-run-mode:
    description: "client validates schema locally; server also runs admission checks and needs write-capable credentials"
    required: false
    default: "client"
runs:
  using: composite
  steps:
    - id: kubeconfig
      shell: bash
      env:
        KUBECONFIG_B64: ${{ inputs.kubeconfig-base64 }}
      run: |
        CONFIG_FILE=$(mktemp "$RUNNER_TEMP/kubeconfig.XXXXXX")
        printf '%s' "$KUBECONFIG_B64" | base64 -d > "$CONFIG_FILE"
        chmod 600 "$CONFIG_FILE"
        echo "KUBECONFIG=$CONFIG_FILE" >> "$GITHUB_ENV"
        echo "config-file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

    - id: validate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KUBE_CONTEXT: ${{ inputs.kube-context }}
        MANIFEST_FILE: ${{ inputs.manifest-file }}
        DRY_RUN_MODE: ${{ inputs.dry-run-mode }}
      run: |
        CONTEXT_ARGS=()
        if [ -n "$KUBE_CONTEXT" ]; then
          CONTEXT_ARGS=(--context "$KUBE_CONTEXT")
        fi
        echo "Validating $MANIFEST_FILE with --dry-run=$DRY_RUN_MODE"
        kubectl "${CONTEXT_ARGS[@]}" apply -f "$MANIFEST_FILE" --dry-run="$DRY_RUN_MODE"

    - name: Remove kubeconfig
      if: always()
      shell: bash
      env:
        CONFIG_FILE: ${{ steps.kubeconfig.outputs.config-file }}
      run: |
        if [ -n "$CONFIG_FILE" ]; then
          rm -f "$CONFIG_FILE"
        fi
