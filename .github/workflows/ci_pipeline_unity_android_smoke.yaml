name: Unity Android Hosted Build

on:
  workflow_call:
    inputs:
      build-profile:
        description: Android AAB build profile relative to the Unity project
        type: string
        required: true
      application-id:
        description: Expected Android application ID
        type: string
        required: true
      accept-personal-terms:
        description: Allow explicit Unity Personal activation under the Unity Editor Software Terms
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UNITY_NO_BANNER: '1'
      UNITY_NO_PAGER: '1'
      UNITY_NO_AGENT_HINTS: '1'

    steps:
      - name: Install the Unity CLI
        env:
          UNITY_CLI_HOME: ${{ runner.temp }}/unity-cli
          UNITY_CLI_VERSION: '1.0.0'
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          installer="$RUNNER_TEMP/unity-install.sh"
          curl -fsSL --retry 3 https://unity.com/install.sh -o "$installer"
          bash "$installer"
          unity="$UNITY_CLI_HOME/bin/unity"
          test "$("$unity" --version)" = "$UNITY_CLI_VERSION"
          printf '%s\n' "$UNITY_CLI_HOME/bin" >> "$GITHUB_PATH"

      - name: Sign in to Unity in your browser
        id: unity-login
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Open the auth_url below in your browser. Sign in with your Unity Personal account.'
          timeout 9m unity auth login --format json >/dev/null

      - name: Activate Unity Personal
        env:
          UNITY_PERSONAL_TERMS_ACCEPTED: ${{ inputs.accept-personal-terms }}
        run: |
          umask 077
          activation_report="$RUNNER_TEMP/unity-activation.json"
          license_report="$RUNNER_TEMP/unity-license-status.json"
          trap 'rm -f -- "$activation_report" "$license_report"' EXIT

          activate_license() {
            local result=0
            unity license activate "$@" --non-interactive --format json > "$activation_report" 2>/dev/null || result=$?
            printf 'Unity license activation exited %s.\n' "$result"
            jq -ce '{success, errors: [.errors[]?.code]}' "$activation_report" || {
              printf '%s\n' '::error::Unity activation returned no valid JSON diagnosis.'
              return 1
            }
            return "$result"
          }

          read_license_status() {
            local result=0
            unity license status --non-interactive --format json > "$license_report" 2>/dev/null || result=$?
            printf 'Unity license status exited %s.\n' "$result"
            jq -ce '{active: .data.active, signedIn: .data.signedIn, products: [.data.licenses[]?.product], errors: [.errors[]?.code]}' "$license_report"
            if [[ "$result" != 0 && "$result" != 4 ]]; then
              return "$result"
            fi
          }

          has_personal_license() {
            jq -e '.success == true and .data.active == true and any(.data.licenses[]?; .product == "Unity Personal")' "$license_report" >/dev/null
          }

          printf '%s\n' 'Activating the assigned Unity entitlements for the signed-in account.'
          activate_license || true
          read_license_status
          if has_personal_license; then
            printf '%s\n' 'Unity Personal is active on this runner.'
            exit 0
          fi

          if ! jq -e '.data.signedIn == true' "$license_report" >/dev/null; then
            printf '%s\n' '::error::The Unity sign-in session was unavailable during license activation.'
            exit 1
          fi
          if [[ "$UNITY_PERSONAL_TERMS_ACCEPTED" != true ]]; then
            printf '%s\n' '::error::No active Unity Personal license. To try explicit Personal activation, accept the Unity Editor Software Terms in the Run workflow form.'
            exit 1
          fi

          printf '%s\n' 'Retrying activation in Unity Personal mode.'
          activate_license --personal --accept-eula
          read_license_status
          if ! has_personal_license; then
            printf '%s\n' '::error::Unity Personal activation finished without an active Personal license.'
            exit 1
          fi
          printf '%s\n' 'Unity Personal is active on this runner.'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Prepare Unity toolchain installation
        id: toolchain
        env:
          BUILD_PROFILE: ${{ inputs.build-profile }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -f "$BUILD_PROFILE"
          editor_version="$(awk '$1 == "m_EditorVersion:" {print $2}' ProjectSettings/ProjectVersion.txt)"
          [[ "$editor_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]
          sudo rm -rf --one-file-system -- /usr/local/lib/android/sdk /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
          download_path="$(unity cache info --format json | jq -er '.data.path | select(type == "string" and length > 0)')"
          printf 'editor-version=%s\ndownload-path=%s\n' "$editor_version" "$download_path" >> "$GITHUB_OUTPUT"

      - name: Restore Unity installer archives
        id: unity-downloads
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.toolchain.outputs.download-path }}
          key: unity-downloads-ubuntu24-x64-android-${{ steps.toolchain.outputs.editor-version }}

      - name: Download Unity and Android installer archives
        if: steps.unity-downloads.outputs.cache-hit != 'true'
        env:
          EDITOR_VERSION: ${{ steps.toolchain.outputs.editor-version }}
        run: |
          unity install "$EDITOR_VERSION" --download-only --module android --child-modules --yes --non-interactive --accept-eula

      - name: Save Unity installer archives
        if: steps.unity-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.toolchain.outputs.download-path }}
          key: ${{ steps.unity-downloads.outputs.cache-primary-key }}

      - name: Install the project's Unity Editor and Android tools
        env:
          EDITOR_VERSION: ${{ steps.toolchain.outputs.editor-version }}
        run: |
          mkdir -p "$RUNNER_TEMP/unity-editors"
          unity install-path --set "$RUNNER_TEMP/unity-editors" --non-interactive
          unity install "$EDITOR_VERSION" --module android --child-modules --yes --non-interactive --accept-eula
          unity cache clean --yes --non-interactive
          df -h "$RUNNER_TEMP"

      - name: Build the Android App Bundle
        env:
          BUILD_PROFILE: ${{ inputs.build-profile }}
          GRADLE_USER_HOME: ${{ runner.temp }}/unity-android-gradle
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/plugin-repositories.init.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              def repositories = settings.pluginManagement.repositories
              def pluginPortal = repositories.findByName('Gradle Central Plugin Repository')
              if (pluginPortal != null) {
                  repositories.remove(pluginPortal)
                  repositories.addLast(pluginPortal)
              }
          }
          GRADLE
          build_dir="$RUNNER_TEMP/unity-android-build"
          mkdir -p "$build_dir"
          unity build "$GITHUB_WORKSPACE" --profile "$BUILD_PROFILE" \
            --args='-refreshImportMode InProcess' \
            --output-path "$build_dir/Player.aab" --log-file "$build_dir/unity.log" --format human --non-interactive

      - name: Check the Android bundle
        env:
          APPLICATION_ID: ${{ inputs.application-id }}
        run: |
          build_dir="$RUNNER_TEMP/unity-android-build"
          cd "$build_dir"
          test -s Player.aab
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$bundletool"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$bundletool" | sha256sum --check
          java -jar "$bundletool" validate --bundle=Player.aab
          java -jar "$bundletool" dump manifest --bundle=Player.aab > android-manifest.xml
          package_id="$(java -jar "$bundletool" dump manifest --bundle=Player.aab --xpath=/manifest/@package)"
          if [[ "$package_id" != "$APPLICATION_ID" ]]; then
            printf 'Expected package %s, found %s\n' "$APPLICATION_ID" "$package_id" >&2
            exit 1
          fi
          version_code="$(java -jar "$bundletool" dump manifest --bundle=Player.aab --xpath=/manifest/@android:versionCode)"
          sha256sum Player.aab > SHA256SUMS
          printf 'Commit %s\nPackage %s\nVersion code %s\n' "$GITHUB_SHA" "$package_id" "$version_code" > build-info.txt

      - name: Keep the test bundle in GitHub Actions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unity-android-build/Player.aab
            ${{ runner.temp }}/unity-android-build/SHA256SUMS
            ${{ runner.temp }}/unity-android-build/android-manifest.xml
            ${{ runner.temp }}/unity-android-build/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Sign out of Unity
        if: always() && steps.unity-login.outcome == 'success'
        timeout-minutes: 5
        run: unity auth logout --yes --non-interactive
