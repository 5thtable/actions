name: Unity Mobile Hosted Build

on:
  workflow_call:
    inputs:
      platform:
        description: Mobile platforms to build
        type: string
        default: ios
      publish-internal:
        description: Publish signed builds to Play Internal testing or internal TestFlight
        type: boolean
        default: false
      ios-build-profile:
        description: iOS build profile relative to the Unity project
        type: string
        default: ''
      android-build-profile:
        description: Android App Bundle build profile relative to the Unity project
        type: string
        default: ''
      application-id:
        description: Expected Android application ID and iOS bundle ID
        type: string
        required: true
      android-upload-key-alias:
        description: Alias of the Android upload key
        type: string
        default: ''
      source-commit:
        description: Optional full SHA already in the default branch history
        type: string
        default: ''
      accept-personal-terms:
        description: Allow Unity Personal activation under the Unity Editor Software Terms
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Android and export iOS
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UNITY_NO_BANNER: '1'
      UNITY_NO_PAGER: '1'
      UNITY_NO_AGENT_HINTS: '1'
    outputs:
      android-artifact: ${{ steps.android-artifact.outputs.artifact-id }}
    steps:
      - name: Check build inputs
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_BUILD_PROFILE: ${{ inputs.ios-build-profile }}
          ANDROID_BUILD_PROFILE: ${{ inputs.android-build-profile }}
          ANDROID_UPLOAD_ALIAS: ${{ inputs.android-upload-key-alias }}
          SOURCE_COMMIT: ${{ inputs.source-commit }}
          PERSONAL_TERMS_ACCEPTED: ${{ inputs.accept-personal-terms }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          case "$PLATFORM" in
            ios) test -n "$IOS_BUILD_PROFILE" ;;
            android) test -n "$ANDROID_BUILD_PROFILE" && test -n "$ANDROID_UPLOAD_ALIAS" ;;
            both) test -n "$IOS_BUILD_PROFILE" && test -n "$ANDROID_BUILD_PROFILE" && test -n "$ANDROID_UPLOAD_ALIAS" ;;
            *) echo '::error::Select Android, iOS, or both.'; exit 1 ;;
          esac
          if [[ "$PERSONAL_TERMS_ACCEPTED" != true ]]; then
            echo '::error::Allow Unity Personal activation under the Unity Editor Software Terms in the Run workflow form.'
            exit 1
          fi
          if [[ -n "$SOURCE_COMMIT" && ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Enter the full commit SHA from the default branch.'
            exit 1
          fi

      - name: Install the Unity CLI
        env:
          UNITY_CLI_HOME: ${{ runner.temp }}/unity-cli
          UNITY_CLI_VERSION: '1.0.0'
        run: |
          installer="$RUNNER_TEMP/unity-install.sh"
          curl -fsSL --retry 3 https://unity.com/install.sh -o "$installer"
          bash "$installer"
          unity="$UNITY_CLI_HOME/bin/unity"
          test "$("$unity" --version)" = "$UNITY_CLI_VERSION"
          printf '%s\n' "$UNITY_CLI_HOME/bin" >> "$GITHUB_PATH"

      - name: Sign in to Unity in your browser
        id: unity-login
        timeout-minutes: 10
        run: |
          printf '%s\n' 'Open the auth_url below in your browser. Sign in with your Unity Personal account.'
          timeout 9m unity auth login --format json >/dev/null

      - name: Activate Unity Personal
        run: |
          umask 077
          activation="$RUNNER_TEMP/unity-personal-activation.json"
          trap 'rm -f -- "$activation"' EXIT
          result=0
          unity license activate --personal --accept-eula --non-interactive --format json > "$activation" 2>/dev/null || result=$?
          jq -ce '{success, errors: [.errors[]?.code]}' "$activation"
          test "$result" = 0
          unity license status --non-interactive --format json 2>/dev/null |
            jq -e '.success and .data.active and any(.data.licenses[]?; .product == "Unity Personal")' >/dev/null
          printf '%s\n' 'Unity Personal is active on this runner.'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source-commit || github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Verify source and prepare the Unity toolchain
        id: source
        env:
          PLATFORM: ${{ inputs.platform }}
          IOS_BUILD_PROFILE: ${{ inputs.ios-build-profile }}
          ANDROID_BUILD_PROFILE: ${{ inputs.android-build-profile }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"; then
            echo '::error::The source commit must be in the default branch history at dispatch time.'
            exit 1
          fi
          if [[ "$PLATFORM" != android ]]; then test -f "$IOS_BUILD_PROFILE"; fi
          if [[ "$PLATFORM" != ios ]]; then test -f "$ANDROID_BUILD_PROFILE"; fi
          editor_version="$(awk '$1 == "m_EditorVersion:" {print $2}' ProjectSettings/ProjectVersion.txt)"
          [[ "$editor_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[abfp][0-9]+$ ]]
          sudo rm -rf --one-file-system -- /usr/local/lib/android/sdk /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP"
          download_path="$(unity cache info --format json | jq -er '.data.path | select(type == "string" and length > 0)')"
          printf 'commit=%s\neditor-version=%s\ndownload-path=%s\n' "$source_commit" "$editor_version" "$download_path" >> "$GITHUB_OUTPUT"

      - name: Restore Unity installer archives
        id: installers
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.source.outputs.download-path }}
          key: unity-downloads-ubuntu24-x64-android-${{ steps.source.outputs.editor-version }}

      - name: Download Unity and Android installer archives
        if: inputs.platform != 'ios' && steps.installers.outputs.cache-hit != 'true'
        env:
          EDITOR_VERSION: ${{ steps.source.outputs.editor-version }}
        run: unity install "$EDITOR_VERSION" --download-only --module android --child-modules --yes --non-interactive --accept-eula

      - name: Save Unity and Android installer archives
        if: inputs.platform != 'ios' && steps.installers.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ steps.source.outputs.download-path }}
          key: ${{ steps.installers.outputs.cache-primary-key }}

      - name: Install Unity and the selected build modules
        id: unity-editor
        env:
          EDITOR_VERSION: ${{ steps.source.outputs.editor-version }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            ios) modules=(--module ios) ;;
            android) modules=(--module android --child-modules) ;;
            both) modules=(--module ios android --child-modules) ;;
          esac
          mkdir -p "$RUNNER_TEMP/unity-editors"
          unity install-path --set "$RUNNER_TEMP/unity-editors" --non-interactive
          unity install "$EDITOR_VERSION" "${modules[@]}" --yes --non-interactive --accept-eula
          unity cache clean --yes --non-interactive
          df -h "$RUNNER_TEMP"

      - name: Export the Xcode project
        if: inputs.platform != 'android'
        id: xcode
        env:
          BUILD_PROFILE: ${{ inputs.ios-build-profile }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          export_dir="$RUNNER_TEMP/unity-ios-export"
          mkdir -p "$export_dir"
          unity build "$GITHUB_WORKSPACE" --profile "$BUILD_PROFILE" \
            --args='-refreshImportMode InProcess' --output-path "$export_dir/Xcode" \
            --log-file "$export_dir/unity.log" --format human --non-interactive
          test -s "$export_dir/Xcode/Unity-iPhone.xcodeproj/project.pbxproj"
          build_number="$(python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["CFBundleVersion"])' < "$export_dir/Xcode/Info.plist")"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          tar -czf "$export_dir/Xcode.tar.gz" -C "$export_dir" Xcode
          rm -rf -- "$export_dir/Xcode"
          printf '%s\n' "$SOURCE_COMMIT" > "$export_dir/source-commit.txt"
          printf '%s\n' "$build_number" > "$export_dir/build-number.txt"
          printf 'build-number=%s\n' "$build_number" >> "$GITHUB_OUTPUT"

      - name: Keep the Xcode project for the signing job
        if: inputs.platform != 'android'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-xcode-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unity-ios-export/Xcode.tar.gz
            ${{ runner.temp }}/unity-ios-export/source-commit.txt
            ${{ runner.temp }}/unity-ios-export/build-number.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Restore tracked source before the Android build
        if: inputs.platform == 'both' && !cancelled() && steps.unity-editor.outcome == 'success'
        id: android-settings
        run: git restore --source=HEAD --worktree -- .

      - name: Build the Android App Bundle
        if: inputs.platform != 'ios' && !cancelled() && steps.unity-editor.outcome == 'success' && steps.android-settings.outcome != 'failure'
        id: android
        env:
          BUILD_PROFILE: ${{ inputs.android-build-profile }}
          GRADLE_USER_HOME: ${{ runner.temp }}/unity-android-gradle
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          IOS_BUILD_NUMBER: ${{ steps.xcode.outputs.build-number }}
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_LATEST_HOME ANDROID_NDK_ROOT
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/plugin-repositories.init.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              def repositories = settings.pluginManagement.repositories
              def pluginPortal = repositories.findByName('Gradle Central Plugin Repository')
              if (pluginPortal != null) {
                  repositories.remove(pluginPortal)
                  repositories.addLast(pluginPortal)
              }
          }
          GRADLE
          build_dir="$RUNNER_TEMP/unity-android-export"
          mkdir -p "$build_dir"
          unity build "$GITHUB_WORKSPACE" --profile "$BUILD_PROFILE" \
            --args='-refreshImportMode InProcess' --output-path "$build_dir/Player.aab" \
            --log-file "$build_dir/unity.log" --format human --non-interactive
          test -s "$build_dir/Player.aab"
          build_number="$(awk '$1 == "AndroidBundleVersionCode:" {print $2}' ProjectSettings/ProjectSettings.asset)"
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          if [[ -n "$IOS_BUILD_NUMBER" && "$build_number" != "$IOS_BUILD_NUMBER" ]]; then
            echo '::error::The Android and iOS build numbers differ.'
            exit 1
          fi
          printf '%s\n' "$SOURCE_COMMIT" > "$build_dir/source-commit.txt"
          printf '%s\n' "$build_number" > "$build_dir/build-number.txt"

      - name: Keep the Android bundle for the signing job
        if: inputs.platform != 'ios' && !cancelled() && steps.android.outcome == 'success'
        id: android-artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: unity-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unity-android-export/Player.aab
            ${{ runner.temp }}/unity-android-export/source-commit.txt
            ${{ runner.temp }}/unity-android-export/build-number.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Sign out of Unity
        if: always() && steps.unity-login.outcome == 'success'
        timeout-minutes: 5
        run: unity auth logout --yes --non-interactive

  wait-for-ios:
    if: inputs.platform != 'android' && github.event_name == 'workflow_dispatch' && github.event.repository.private && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    outputs:
      artifact: ${{ steps.payload.outputs.artifact-id }}
    steps:
      - name: Check out the artifact handoff script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: unity-mobile-sign

      - name: Wait for the Xcode project
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_NAME: unity-xcode-${{ github.run_id }}-${{ github.run_attempt }}
          PAYLOAD_STEP: Keep the Xcode project for the signing job
        run: bash "$GITHUB_WORKSPACE/unity-mobile-sign/wait-for-payload.sh"

  sign-ios:
    needs: wait-for-ios
    runs-on: macos-26
    timeout-minutes: 45
    environment: mobile-ios-build
    outputs:
      artifact: ${{ steps.signed.outputs.artifact-id }}
      build-number: ${{ steps.sign.outputs.build-number }}
      app-version: ${{ steps.sign.outputs.app-version }}
    steps:
      - name: Check the Xcode toolchain
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$sdk_version" =~ ^[0-9]+\.[0-9]+ && "${sdk_version%%.*}" -ge 26 ]]

      - name: Check out the signing scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: unity-mobile-sign

      - name: Download the Xcode project
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.wait-for-ios.outputs.artifact }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/ios-build-input

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.3'

      - name: Install xcodeproj
        run: gem install xcodeproj --version 1.28.1 --no-document

      - name: Archive and sign the iOS app
        id: sign
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.ROTLAND_IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.ROTLAND_IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.ROTLAND_IOS_PROVISIONING_PROFILE_BASE64 }}
          MOBILE_BUILD_INPUT: ${{ runner.temp }}/ios-build-input
          MOBILE_BUILD_OUTPUT: ${{ runner.temp }}/ios-build-output
          MOBILE_APPLICATION_ID: ${{ inputs.application-id }}
        run: bash "$GITHUB_WORKSPACE/unity-mobile-sign/sign-ios.sh"

      - name: Keep the signed IPA in GitHub Actions
        id: signed
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-signed-${{ steps.sign.outputs.app-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-build-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Keep Xcode diagnostics when signing fails
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: xcode-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-archive.log
            ${{ runner.temp }}/ios-export.log
          if-no-files-found: ignore
          retention-days: 3

  sign-android:
    needs: build
    if: "!cancelled() && needs.build.outputs.android-artifact != ''"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mobile-android-build
    outputs:
      artifact: ${{ steps.signed.outputs.artifact-id }}
      build-number: ${{ steps.sign.outputs.build-number }}
    steps:
      - name: Check out the signing scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: unity-mobile-sign

      - name: Download the Android App Bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.build.outputs.android-artifact }}
          path: ${{ runner.temp }}/android-build-input

      - name: Sign and verify the Android App Bundle
        id: sign
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ROTLAND_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_PASSWORD: ${{ secrets.ROTLAND_ANDROID_UPLOAD_PASSWORD }}
          ANDROID_UPLOAD_ALIAS: ${{ inputs.android-upload-key-alias }}
          MOBILE_BUILD_INPUT: ${{ runner.temp }}/android-build-input
          MOBILE_BUILD_OUTPUT: ${{ runner.temp }}/android-build-output
          MOBILE_APPLICATION_ID: ${{ inputs.application-id }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          bash "$GITHUB_WORKSPACE/unity-mobile-sign/sign-android.sh"

      - name: Keep the signed AAB in GitHub Actions
        id: signed
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-signed-${{ steps.sign.outputs.app-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-build-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-play:
    needs: sign-android
    if: inputs.publish-internal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: play-internal
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the store actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: mobile-store

      - name: Download the signed AAB
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.sign-android.outputs.artifact }}
          path: ${{ runner.temp }}/play-internal

      - name: Authenticate to Google Play
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}

      - name: Publish to Play Internal testing
        uses: ./mobile-store
        with:
          operation: play
          application-id: ${{ inputs.application-id }}
          build-number: ${{ needs.sign-android.outputs.build-number }}
          artifact-directory: ${{ runner.temp }}/play-internal

  upload-testflight:
    needs: sign-ios
    if: inputs.publish-internal
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight-internal
    steps:
      - name: Check out the store actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: mobile-store

      - name: Download the signed IPA
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.sign-ios.outputs.artifact }}
          path: ${{ runner.temp }}/testflight-internal

      - name: Upload to App Store Connect
        uses: ./mobile-store
        with:
          operation: app-store-connect
          application-id: ${{ inputs.application-id }}
          build-number: ${{ needs.sign-ios.outputs.build-number }}
          app-version: ${{ needs.sign-ios.outputs.app-version }}
          artifact-directory: ${{ runner.temp }}/testflight-internal
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}

  distribute-testflight:
    needs: [sign-ios, upload-testflight]
    if: inputs.publish-internal
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: testflight-internal
    steps:
      - name: Check out the store actions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: mobile-store

      - name: Verify and distribute to the internal TestFlight group
        uses: ./mobile-store
        with:
          operation: testflight
          application-id: ${{ inputs.application-id }}
          build-number: ${{ needs.sign-ios.outputs.build-number }}
          app-version: ${{ needs.sign-ios.outputs.app-version }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP }}
          TESTFLIGHT_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.TESTFLIGHT_USES_NON_EXEMPT_ENCRYPTION }}
