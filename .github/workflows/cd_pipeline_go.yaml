name: Deploy

on:
  workflow_call:
    inputs:
      app-name:
        description: "Image name within the registry"
        required: false
        type: string
        default: ${{ github.event.repository.name }}
      image-registry:
        description: "Registry and namespace prefix, for example ghcr.io/my-org"
        required: true
        type: string
      target-environment:
        description: "development or production"
        required: true
        type: string
      manifest-file:
        description: "Path to the Kubernetes manifest with the image placeholder"
        required: true
        type: string
      manifest-file-dev:
        description: "Manifest override for development; empty falls back to manifest-file"
        required: false
        type: string
        default: ""
      working-directory:
        description: "Directory to build from and resolve manifests against"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Dockerfile path relative to the working directory"
        required: false
        type: string
        default: "Dockerfile"
      rollout-deployment:
        description: "Deployment to wait on after apply; empty skips the wait"
        required: false
        type: string
        default: ""
      rollout-namespace:
        description: "Namespace of the rollout deployment"
        required: false
        type: string
        default: "default"
      registry-login:
        description: "Log in to the registry with the provided secrets before pushing"
        required: false
        type: string
        default: "true"
      stop-release-filename:
        description: "Deploys are refused while this file exists at the repo root"
        required: false
        type: string
        default: "STOP_RELEASE"
    secrets:
      kubeconfig-dev:
        description: "Base64 kubeconfig for the development cluster"
        required: false
      kubeconfig-prod:
        description: "Base64 kubeconfig for the production cluster"
        required: false
      registry-username:
        description: "Registry login user"
        required: false
      registry-password:
        description: "Registry login password or token"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.target-environment }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release gate
        env:
          STOP_FILE: ${{ inputs.stop-release-filename }}
        run: |
          if [ -f "$STOP_FILE" ]; then
            echo "$STOP_FILE exists at the repo root; refusing to deploy."
            cat "$STOP_FILE"
            exit 1
          fi
          echo "Release gate open."

  deploy-dev:
    if: inputs.target-environment == 'development'
    needs: [release-gate]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        if: inputs.registry-login == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Select manifest
        id: manifest
        env:
          MANIFEST: ${{ inputs.manifest-file }}
          MANIFEST_DEV: ${{ inputs.manifest-file-dev }}
        run: |
          SELECTED="$MANIFEST"
          if [ -n "$MANIFEST_DEV" ]; then
            SELECTED="$MANIFEST_DEV"
          fi
          echo "Using manifest: $SELECTED"
          echo "file=$SELECTED" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: 5thtable/actions/deploy-manifest@v1
        with:
          app-name: ${{ inputs.app-name }}
          image-registry: ${{ inputs.image-registry }}
          kubeconfig-base64: ${{ secrets.kubeconfig-dev }}
          manifest-file: ${{ steps.manifest.outputs.file }}
          working-directory: ${{ inputs.working-directory }}
          dockerfile: ${{ inputs.dockerfile }}
          additional-tag: dev
          rollout-deployment: ${{ inputs.rollout-deployment }}
          rollout-namespace: ${{ inputs.rollout-namespace }}

  deploy-prod:
    if: inputs.target-environment == 'production'
    needs: [release-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        if: inputs.registry-login == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.image-registry }}
          username: ${{ secrets.registry-username }}
          password: ${{ secrets.registry-password }}

      - name: Deploy
        uses: 5thtable/actions/deploy-manifest@v1
        with:
          app-name: ${{ inputs.app-name }}
          image-registry: ${{ inputs.image-registry }}
          kubeconfig-base64: ${{ secrets.kubeconfig-prod }}
          manifest-file: ${{ inputs.manifest-file }}
          working-directory: ${{ inputs.working-directory }}
          dockerfile: ${{ inputs.dockerfile }}
          additional-tag: prod
          rollout-deployment: ${{ inputs.rollout-deployment }}
          rollout-namespace: ${{ inputs.rollout-namespace }}
